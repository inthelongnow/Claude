<title>Phase Nest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Instrument+Serif:ital@0;1&display=swap">
<style>
  /* Single deliberate dark world: an oscilloscope in a dark room. */
  :root {
    color-scheme: dark;
    --ink: #06070c;
    --panel: #0e1019;
    --bone: #ece6d6;
    --dim: #80859a;
    --line: rgba(236, 230, 214, 0.16);
    --amber: #ffb000;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--ink);
    color: var(--bone);
    font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .wrap {
    height: 100%;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding-inline: 16px;
    padding-block: 10px;
  }
  .stage {
    position: relative;
    aspect-ratio: 9 / 16;
    height: min(calc(100% - 58px), calc((100vw - 32px) * 16 / 9));
    max-width: 100%;
    background: var(--ink);
    border: 1px solid var(--line);
    border-radius: 3px;
    overflow: hidden;
  }
  .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .gate {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    background: radial-gradient(ellipse at 50% 45%, rgba(6,7,12,0.35), rgba(6,7,12,0.88) 70%);
    text-align: center; padding-inline: 16px;
  }
  .gate[hidden] { display: none; }
  .gate h1 {
    margin: 0;
    font-family: "Instrument Serif", Georgia, serif; font-style: italic; font-weight: 400;
    font-size: clamp(40px, 11vmin, 76px); line-height: 0.95; letter-spacing: -0.01em;
    text-wrap: balance;
  }
  .gate p { margin: 0; color: var(--dim); font-size: 12px; letter-spacing: 0.06em; max-width: 30ch; line-height: 1.55; }
  .go {
    font: 600 13px/1 "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--ink); background: var(--amber); border: 0; border-radius: 999px;
    padding: 13px 22px; cursor: pointer; font-variant-numeric: tabular-nums; min-width: 220px;
  }
  .go:disabled { background: var(--panel); color: var(--dim); cursor: progress; outline: 1px solid var(--line); }
  .go:focus-visible, .bar button:focus-visible { outline: 2px solid var(--bone); outline-offset: 2px; }
  .bar {
    display: flex; gap: 6px; align-items: center; max-width: 100%;
    overflow-x: auto; padding-block: 2px; scrollbar-width: none;
  }
  .bar button {
    flex: none;
    font: 400 12px/1 "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 0.04em;
    color: var(--dim); background: transparent; border: 1px solid var(--line); border-radius: 999px;
    padding: 9px 12px; cursor: pointer;
  }
  .bar button[aria-current="true"] { color: var(--ink); background: var(--bone); border-color: var(--bone); }
  .bar #play { color: var(--bone); min-width: 74px; }
</style>

<div class="wrap">
  <div class="stage" id="stage">
    <canvas id="fx"></canvas>
    <canvas id="hud"></canvas>
    <div class="gate" id="gate">
      <h1>Phase Nest</h1>
      <p>A slow tour of brain rhythms as music: carrier waves, θ–γ coupling, ephaptic sync and the EEG bands. Every sample is computed in plain JavaScript.</p>
      <button class="go" id="go" disabled>Synthesizing 0%</button>
    </div>
  </div>
  <nav class="bar" id="bar" aria-label="Scenes">
    <button id="play" type="button">Play</button>
  </nav>
</div>

<script>
"use strict";
/* ───────────────────────── shared math ───────────────────────── */
const TAU = Math.PI * 2;
const clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
const ramp = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const smooth = x => x * x * (3 - 2 * x);
function mulberry(seed) {
  return () => {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const C = {
  ink: "#06070c", bone: "#ece6d6", dim: "#80859a", faint: "rgba(236,230,214,0.16)",
  d: "#7483ff", th: "#ffb000", al: "#ff5d8f", be: "#35d6c8", ga: "#c9a6ff",
};

/* ───────────────────────── timeline ───────────────────────── */
const SR = 44100;
const SLOW = 16;                                         // listening speed for nested rhythms
const S1 = [0, 30];
const S2 = [30, 70], S2B = 40, S2C = SLOW / 6;           // slowed θ cycle: 6 Hz ÷ 16
const COMO_SPEC = [[6,7],[5,9],[8,5],[4,11],[7,9],[6,13]];
const BARS = [];
{ let t0 = 70; for (const [fp, n] of COMO_SPEC) for (let rep = 0; rep < 2; rep++) { const dur = SLOW / fp; BARS.push({ t0, t1: t0 + dur, fp, n, fa: fp * n, dur }); t0 += dur; } }
const S3 = [70, BARS[BARS.length - 1].t1];
const S4 = [S3[1], S3[1] + 40];
const S5 = [S4[1], S4[1] + 40];
const END = S5[1] + 6;
const N = Math.ceil(END * SR);
const SCENES = [
  { title: "Carrier", chip: "Carrier", r: S1 },
  { title: "θ nests γ", chip: "θ–γ", r: S2 },
  { title: "Comodulogram", chip: "Comod", r: S3 },
  { title: "Ephaptic field", chip: "Field", r: S4 },
  { title: "Band chord", chip: "Bands", r: S5 },
];
const sceneAt = t => { for (let i = SCENES.length - 1; i >= 0; i--) if (t >= SCENES[i].r[0]) return i; return 0; };

/* Scene 1: carrier, AM at 40 Hz, binaural 6 Hz */
const s1d = t => smooth(ramp(t, 8, 11)) * (1 - smooth(ramp(t, 16, 18)));
const s1b = t => smooth(ramp(t, 17, 19));
const S1G = 0.26;
const s1g = t => S1G * smooth(ramp(t, 0, 2)) * (1 - smooth(ramp(t, 28.8, 30)));
const s1am = t => 1 - s1d(t) * 0.5 * (1 - Math.cos(TAU * 40 * t));
function s1dphi(t) {                   // ∫ 2π·6·b(t) dt, closed form
  if (t < 17) return 0;
  if (t > 19) return TAU * 6 * (1 + (t - 19));
  const x = (t - 17) / 2; return TAU * 6 * 2 * (x * x * x - x * x * x * x / 2);
}

/* Scene 2: θ–γ phase–amplitude coupling */
const CHORDS = [[1, 5/4, 3/2, 15/8], [5/6, 1, 5/4, 3/2], [2/3, 5/6, 1, 5/4], [3/4, 15/16, 9/8, 4/3]];
const CHORD_NAMES = ["I", "vi", "IV", "V⁷"];
const A_pac = (phi, chi, ps) => { const v = (1 + chi * Math.cos(phi - ps)) / 2; return v * v; };
const s2chi = t => 0.3 + 0.7 * smooth(ramp(t, 50, 58));
const s2ps = c => Math.PI - Math.max(0, c - 6) * TAU / 7;   // precession starts after the χ ramp
function s2At(t) {
  if (t < S2B) { const u = t - S2[0]; return { slow: false, fth: 6, phase: (TAU * 6 * u) % TAU, chi: 1, ps: Math.PI, c: 0, c0: S2[0] }; }
  const u = t - S2B, c = Math.floor(u / S2C);
  return { slow: true, fth: 6 / SLOW, phase: ((u - c * S2C) / S2C) * TAU, chi: s2chi(t), ps: s2ps(c), c, c0: S2B + c * S2C };
}

/* Scene 3 helpers */
const octRed = f => { while (f >= 110) f /= 2; while (f < 55) f *= 2; return f; };
const barAt = t => { for (let i = BARS.length - 1; i >= 0; i--) if (t >= BARS[i].t0) return i; return 0; };

/* Scene 4: Kuramoto mean-field (ephaptic) oscillators */
const NO = 21, KF = 60, S4D = S4[1] - S4[0];
const GAM = TAU * 0.11, KC = 2 * GAM, KMAX = 3 * KC;
const kurK = u => KMAX * smooth(ramp(u, 8, 28));
const OMEGA = [], OSC_F = [];
const SCALE6 = [1, 9/8, 5/4, 3/2, 5/3, 15/8];
for (let i = 0; i < NO; i++) {
  const q = (i + 0.5) / NO;
  OMEGA.push(TAU * clamp(0.9 + 0.11 * Math.tan(Math.PI * (q - 0.5)), 0.58, 1.22));
  OSC_F.push(128 * SCALE6[i % 6] * 2 ** Math.floor(i / 6));
}
let KC_U = 8; for (let u = 8; u < 28; u += 0.001) if (kurK(u) >= KC) { KC_U = u; break; }
const KUR = { phases: [], R: [], psi: [], spikes: Array.from({ length: NO }, () => []) };
const kurIdx = t => clamp((t - S4[0]) * KF, 0, KUR.R.length - 1);
function kurR(t) { const x = kurIdx(t), i = Math.floor(x), f = x - i; const a = KUR.R[i], b = KUR.R[Math.min(i + 1, KUR.R.length - 1)]; return a + (b - a) * f; }

/* Scene 5: EEG bands, octave-reduced into a chord */
const BANDS = [
  { s: "δ", f: 2,  p: 128, c: C.d,  pan: 0 },
  { s: "θ", f: 6,  p: 384, c: C.th, pan: -0.5 },
  { s: "α", f: 10, p: 320, c: C.al, pan: 0.5 },
  { s: "β", f: 15, p: 480, c: C.be, pan: -0.25 },
  { s: "γ", f: 40, p: 640, c: C.ga, pan: 0.25 },
];
const BAND_STEP = 5, S5_OUT = 39;
function bandEnv(i, u) {
  let e = (1 + Math.cos(TAU * BANDS[i].f * u)) / 2;
  if (i > 0) e *= 0.35 + 0.65 * (1 + Math.cos(TAU * BANDS[i - 1].f * u)) / 2;
  return e;
}
const bandIn = (i, u) => smooth(ramp(u, BAND_STEP * i, BAND_STEP * i + 1.5)) * (1 - smooth(ramp(u, 35, S5_OUT)));

/* ───────────────────────── score (events) ───────────────────────── */
const EV = [];
const ev = (t, type, o = {}) => EV.push(Object.assign({ t, type, a: 0.5, pan: 0, f: 0, dec: 0.3 }, o));
function buildScore() {
  // S2: slowed layer, one soft pulse per θ cycle
  for (let c = 0; ; c++) {
    const c0 = S2B + c * S2C; if (c0 >= S2[1] - 0.5) break;
    const ch = CHORDS[Math.floor(c / 2) % 4];
    if (c >= 1) ev(c0, "kick", { a: 0.28 });
    for (let k = 0; k < 7; k++) {
      const tn = c0 + k * S2C / 7; if (tn >= S2[1] - 0.6) break;
      const A = A_pac(TAU * k / 7, s2chi(tn), s2ps(c));
      ev(tn, "pluck", { f: 256 * ch[k % 4] * 2 ** Math.floor(k / 4), a: 0.03 + 0.24 * A, pan: -0.6 + 1.2 * k / 6, dec: 0.7 });
    }
  }
  // S3: tuplet bars
  for (const b of BARS) {
    ev(b.t0, "kick", { a: 0.3 });
    for (let k = 0; k < b.n; k++) {
      const tn = b.t0 + k * b.dur / b.n, A = A_pac(TAU * k / b.n, 0.9, Math.PI);
      ev(tn, "pluck", { f: 32 * (b.n + k), a: 0.04 + 0.22 * A, pan: -0.7 + 1.4 * k / (b.n - 1), dec: 0.5 });
    }
  }
  // S4: Kuramoto integration. Each spike is a note; the pulse waits for synchrony
  const rnd = mulberry(7), dt = 1 / 1200, steps = S4D * 1200, th = Array.from({ length: NO }, () => rnd() * TAU);
  let prevPsi = 0, lastKick = -1;
  for (let s = 0; s <= steps; s++) {
    const u = s * dt; let sc = 0, ss = 0;
    for (let i = 0; i < NO; i++) { sc += Math.cos(th[i]); ss += Math.sin(th[i]); }
    const Rr = Math.hypot(sc, ss) / NO, psi = Math.atan2(ss, sc), K = kurK(u);
    if (s % (1200 / KF) === 0) { KUR.phases.push(Float32Array.from(th)); KUR.R.push(Rr); KUR.psi.push(psi); }
    if (prevPsi < 0 && psi >= 0 && Rr > 0.5 && u - lastKick > 0.6 && u < S4D - 1) { ev(S4[0] + u, "kick", { a: 0.15 + 0.3 * Rr }); lastKick = u; }
    prevPsi = psi;
    for (let i = 0; i < NO; i++) {
      th[i] += dt * (OMEGA[i] + K * Rr * Math.sin(psi - th[i]));
      if (th[i] >= TAU) {
        th[i] -= TAU; const ts = S4[0] + u + dt;
        KUR.spikes[i].push(ts);
        if (u < S4D - 1) ev(ts, "pluck", { f: OSC_F[i], a: 0.045, pan: -0.8 + 1.6 * i / (NO - 1), dec: 0.6 });
      }
    }
  }
  // S5: a soft delta pulse, then a closing bloom
  const s5 = S5[0];
  for (let u = BAND_STEP; u < 35; u += 1) ev(s5 + u, "kick", { a: 0.25 });
  for (const b of BANDS) ev(s5 + 35, "pluck", { f: b.p, a: 0.08, pan: b.pan, dec: 2.2 });
  ev(s5 + 35, "pluck", { f: 64, a: 0.18, dec: 2.4 });
  EV.sort((a, b) => a.t - b.t);
}
buildScore();

/* ───────────────────────── synthesis ───────────────────────── */
const L = new Float32Array(N), R = new Float32Array(N);
let synthDone = false, peakBefore = 0;
function renderContinuous(i0, i1, st) {
  for (let i = i0; i < i1; i++) {
    const t = i / SR; let l = 0, r = 0;
    if (t < 10.2) {
      const g = s1g(t);
      if (g > 0) {
        const am = s1am(t), a = TAU * 256 * t;
        l += g * am * Math.sin(a); r += g * am * Math.sin(a + s1dphi(t));
        const sub = 0.1 * s1b(t) * (g / S1G) * Math.sin(TAU * 128 * t); l += sub; r += sub;
      }
    }
    if (t >= S2[0] && t < S2[1]) {
      const u = t - S2[0], A = A_pac(TAU * 6 * u, 1, Math.PI);
      const g = 0.16 * smooth(ramp(t, S2[0], S2[0] + 1.5)) * (1 - 0.8 * smooth(ramp(t, S2B - 1, S2B + 1))) * (1 - smooth(ramp(t, S2[1] - 1, S2[1])));
      const s = g * A * (0.55 + 0.45 * Math.cos(TAU * 42 * u)) * (Math.sin(TAU * 640 * t) + 0.3 * Math.sin(TAU * 960 * t));
      l += 0.8 * s; r += s;
      if (t >= S2B) {
        const q = s2At(t), f = 64 * CHORDS[Math.floor(q.c / 2) % 4][0];
        st.pB2 += TAU * f / SR;
        const e = (1 + Math.cos(q.phase - q.ps)) / 2;
        const gb = 0.18 * e * smooth(ramp(t, S2B, S2B + 2)) * (1 - smooth(ramp(t, S2[1] - 1, S2[1])));
        const s2 = gb * (Math.sin(st.pB2) + 0.3 * Math.sin(2 * st.pB2)); l += s2; r += s2;
      }
    }
    if (t >= S3[0] && t < S3[1]) {
      while (st.bar < BARS.length - 1 && t >= BARS[st.bar].t1) st.bar++;
      const b = BARS[st.bar]; st.pB3 += TAU * octRed(32 * b.n) / SR;
      const g = 0.2 * Math.exp(-0.9 * (t - b.t0)) * smooth(ramp(t - b.t0, 0, 0.02)) * (1 - smooth(ramp(t, S3[1] - 0.5, S3[1])));
      const s = g * (Math.sin(st.pB3) + 0.35 * Math.sin(2 * st.pB3)); l += s; r += s;
    }
    if (t >= S4[0] && t < S4[1]) {
      const Rt = kurR(t), g = 0.09 * Rt * Rt * (1 - smooth(ramp(t, S4[1] - 1.5, S4[1])));
      const s = g * (Math.sin(TAU * 64 * t) + 0.7 * Math.sin(TAU * 96 * t) + 0.5 * Math.sin(TAU * 160 * t) + 0.35 * Math.sin(TAU * 240 * t));
      const w = 0.2 * Math.sin(TAU * 0.3 * t); l += s * (1 + w); r += s * (1 - w);
    }
    if (t >= S5[0] && t < S5[0] + S5_OUT) {
      const u = t - S5[0];
      for (let k = 0; k < 5; k++) {
        const gi = bandIn(k, u); if (gi <= 0) continue;
        const p = TAU * BANDS[k].p * u;
        const s = 0.14 * gi * bandEnv(k, u) * (Math.sin(p) + 0.25 * Math.sin(2 * p) + 0.08 * Math.sin(3 * p));
        const pa = (BANDS[k].pan + 1) * Math.PI / 4; l += s * Math.cos(pa); r += s * Math.sin(pa);
      }
    }
    L[i] += l; R[i] += r;
  }
}
const nrnd = mulberry(99);
function renderEvent(e) {
  const i0 = Math.round(e.t * SR), pa = (e.pan + 1) * Math.PI / 4, gl = Math.cos(pa), gr = Math.sin(pa);
  let len, fn;
  if (e.type === "kick") {
    len = 0.4 * SR; let ph = 0;
    fn = tau => { ph += TAU * (44 + 80 * Math.exp(-tau * 28)) / SR; return Math.sin(ph) * Math.exp(-tau * 8) + (tau < 0.002 ? (nrnd() * 2 - 1) * 0.5 : 0); };
  } else if (e.type === "tick") {
    len = 0.03 * SR; let prev = 0;
    fn = tau => { const n = nrnd() * 2 - 1, hp = n - prev; prev = n; return hp * Math.exp(-tau * 170); };
  } else if (e.type === "snare") {
    len = 0.2 * SR;
    fn = tau => (nrnd() * 2 - 1) * 0.7 * Math.exp(-tau * 20) + 0.4 * Math.sin(TAU * 185 * tau) * Math.exp(-tau * 30);
  } else {
    len = Math.min(e.dec * 6, 2.5) * SR;
    const f = e.f;
    fn = tau => (Math.sin(TAU * f * tau) + 0.35 * Math.sin(TAU * 2 * f * tau) * Math.exp(-tau * 6) + 0.15 * Math.sin(TAU * 3 * f * tau) * Math.exp(-tau * 12))
      * Math.exp(-tau / e.dec) * Math.min(1, tau / 0.004);
  }
  for (let j = 0; j < len && i0 + j < N; j++) { const v = e.a * fn(j / SR); L[i0 + j] += v * gl * 1.41; R[i0 + j] += v * gr * 1.41; }
}
async function synthesize(onProgress) {
  const st = { pB2: 0, pB3: 0, bar: 0 }, chunk = SR;
  const total = N + EV.length * 2000;
  for (let i = 0; i < N; i += chunk) {
    renderContinuous(i, Math.min(N, i + chunk), st);
    onProgress(i / total, i);
    await new Promise(r => setTimeout(r, 0));
  }
  for (let k = 0; k < EV.length; k++) {
    renderEvent(EV[k]);
    if (k % 150 === 0) { onProgress((N + k * 2000) / total, N); await new Promise(r => setTimeout(r, 0)); }
  }
  let peak = 0; const drive = 1.15, norm = Math.tanh(drive);
  for (let i = 0; i < N; i++) {
    L[i] = Math.tanh(L[i] * drive) / norm; R[i] = Math.tanh(R[i] * drive) / norm;
    peak = Math.max(peak, Math.abs(L[i]), Math.abs(R[i]));
  }
  peakBefore = peak;
  const k = 0.92 / peak; for (let i = 0; i < N; i++) { L[i] *= k; R[i] *= k; }
  synthDone = true; onProgress(1, N);
}

/* ───────────────────────── captions ───────────────────────── */
// One idea at a time: a plain sentence, and the math underneath it.
const CAP = [];
const cap = (t, text, tech = "", c = C.bone) => CAP.push({ t, text, tech, c });
cap(0.8, "Every sound here starts as a single sine wave, called a carrier.", "f_c = 256 Hz  ·  δ 2 Hz × 2⁷");
cap(8, "Pulse its loudness 40 times a second. The auditory cortex follows along: the 40 Hz steady-state response.", "s(t) = [1 + m·cos 2π·40t] · cos 2π·256t", C.ga);
cap(12.5, "Modulating amplitude creates two new frequencies, one on each side of the carrier.", "sidebands: 256 ± 40 → 216 Hz, 296 Hz", C.ga);
cap(17, "Now split it: 256 Hz in the left ear, 262 Hz in the right. Headphones help here.", "L 256 Hz  |  R 262 Hz", C.th);
cap(21.5, "Neither ear gets a beat. The brainstem compares the two and produces a 6 Hz theta beat.", "Δf = 262 − 256 = 6 Hz  (θ)", C.th);
cap(26, "The shape plots left against right. The drifting phase turns it six times a second.", "Δφ(t) = 2π · 6t");
cap(30.8, "Brain rhythms nest inside each other. Fast gamma waves ride on slower theta waves.", "phase–amplitude coupling", C.th);
cap(35, "At real speed: gamma at 42 Hz swells and fades with each 6 Hz theta cycle.", "θ 6 Hz  ×  γ 42 Hz", C.ga);
cap(40.2, "Slowed down 16 times, the nesting becomes a rhythm you can follow.", "42 ÷ 6 = 7 gamma cycles per theta cycle", C.ga);
cap(46, "Seven notes per bar. One theory says each gamma cycle holds one item in working memory.", "Lisman & Idiart, 1995  ·  7 ± 2");
cap(52, "As coupling strength χ grows, loud notes get louder and quiet ones fade.", "A(φ) = ((1 + χ·cos(φ − φ*)) / 2)²", C.th);
cap(58.5, "Then the peak moves a little earlier each cycle, like phase precession in the hippocampus.", "φ* shifts 2π/7 per cycle", C.al);
cap(64, "The histogram sorts gamma amplitude by theta phase. The more uneven it is, the stronger the coupling.", "Tort MI = (log N − H(P)) / log N,  N = 18");
cap(70.8, "A comodulogram maps every pairing of a slow rhythm's phase with a fast rhythm's amplitude.", "x: phase frequency  ·  y: amplitude frequency");
cap(77.5, "Each bright spot is one coupling. The ratio between the two rhythms becomes a tuplet.", "7:1 → seven notes per bar", C.th);
cap(85, "The notes are harmonics of a low C, starting at the ratio number. The rhythm ratio is also the tuning.", "n:1 plays harmonics n … 2n−1 of 32 Hz", C.be);
cap(93, "The 11th and 13th harmonics fall between piano keys. They belong to the harmonic series.", "11th ≈ F♯ −49¢  ·  13th ≈ A♭ +41¢", C.al);
cap(99, "The dashed lines mark whole-number ratios, where each fast cycle fits evenly inside the slow one.", "f_A = n · f_φ");
{
  const s4 = S4[0];
  cap(s4 + 0.8, "Neurons can also sync without synapses, through the electric field they share.", "ephaptic coupling", C.be);
  cap(s4 + 7, "Here are 21 oscillators, each with its own natural speed. When one fires, it plays a note.", "ωᵢ ≈ 0.9 ± 0.11 Hz  ·  Kuramoto model");
  cap(s4 + 14, "Each one feels only the average of all the others. That average stands in for the field.", "dθᵢ/dt = ωᵢ + K·R·sin(ψ − θᵢ)", C.be);

/* Scene 1 */
function drawS1(t) {
  const { cx, cy, r } = LY.main, gain = s1g(t) / S1G;

  text(hud, "SPECTRUM · Hz", S.x, S.y + 0.02 * W, { c: C.dim, f: mono(0.024 * W) });

  for (const s of stems) {
    if (s.a < 0.01) continue; const x = X(s.f) + (s.f === 262 ? 2 : 0), h = s.a * (sh - 0.06 * W);
    hud.strokeStyle = s.c; hud.lineWidth = 2; line(hud, x, base, x, base - h);

  const ey = base + 0.07 * W, eh = S.y + S.h - ey, emid = ey + eh / 2;
  text(hud, "L+R ENVELOPE · last 1 s", S.x, ey + 0.005 * W, { c: C.dim, f: mono(0.024 * W) });
  hud.fillStyle = "rgba(255,176,0,0.28)"; hud.strokeStyle = C.th; hud.lineWidth = 1.2;

}

/* Scene 2 */

/* Scene 3 */
function drawS3(t) {

  text(hud, "f_φ phase freq (Hz) →", px1, py1 + 0.065 * W, { c: C.dim, f: mono(0.024 * W), al: "right" });
  text(hud, "f_A ↑", px0 - 6, py0 - 0.012 * W, { c: C.dim, f: mono(0.024 * W), al: "right" });

/* Scene 4 */
function drawS4(t) {

  }

  hud.strokeStyle = C.dim; hud.lineWidth = 1; hud.beginPath();
  for (let j = 0; j <= 200; j++) { const uu = j / 200 * S4D; j ? hud.lineTo(X(uu), Y(kurK(uu) / KMAX)) : hud.moveTo(X(uu), Y(kurK(uu) / KMAX)); } hud.stroke();

function drawEnd(t) {

/* captions and HUD */

function drawHud(t, si) {

}
function drawTitle(t, si) {

  text(hud, `0${si + 1}`, cx, cy - 0.1 * W, { c: C.dim, f: mono(0.03 * W), al: "center", bl: "middle", a });
  text(hud, SCENES[si].title, cx, cy + 0.01 * W, { c: C.bone, f: serif(0.12 * W), al: "center", bl: "middle", a });

let freq;
function drawStrip() {

/* ───────────────────────── transport ───────────────────────── */
